# Deploy with (from this folder, after `npx wrangler login`):
#   npx wrangler deploy --var BOT_ID:<numeric part of the bot token>
name = "loop-telegram-bridge"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Numeric part of the bot token (before the colon). Not secret: it is the bot's public ID.
BOT_ID = "0"
